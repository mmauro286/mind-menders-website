backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images

site_url: https://mindmenderz.com
display_url: https://mindmenderz.com
logo_url: https://mindmenderz.com/logo-icon.png

collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string, hint: "Shown in search results and social shares. Keep under 160 characters." }
      - { label: Publish Date, name: pubDate, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Author, name: author, widget: string, default: "Matthew Mauro, PMHNP-BC" }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options:
          - ADHD
          - Anxiety
          - Depression
          - Autism
          - Bipolar Disorder
          - PTSD
          - OCD
          - Schizophrenia
          - Mood Disorders
          - Medication Management
          - Telehealth
          - Mental Health
          - Adults
          - Children
          - Adolescents
          - Diagnosis
          - Treatment
      - { label: Draft, name: draft, widget: boolean, default: false, hint: "Check to save without publishing." }
      - { label: Body, name: body, widget: markdown }
